<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Privacy Policy for Solitaire Klondike by Paul Kart.">
  <title>Privacy Policy — Solitaire Klondike</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#222; --muted:#666; --line:#ddd; --panel:#f5f5f5; --link:#1769aa; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#121212; --fg:#eee; --muted:#aaa; --line:#333; --panel:#1e1e1e; --link:#80c7ff; }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 Arial,Helvetica,sans-serif; }
    main { max-width:850px; margin:0 auto; padding:36px 22px 56px; }
    h1 { line-height:1.25; margin:0 0 8px; }
    h2 { margin:30px 0 8px; line-height:1.35; }
    p, li { overflow-wrap:anywhere; }
    .subtitle, .muted { color:var(--muted); }
    .date { display:inline-block; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--muted); }
    a { color:var(--link); }
    footer { margin-top:42px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:.9rem; }
    .language { margin-top:48px; padding-top:30px; border-top:2px solid var(--line); }
  </style>
</head>
<body>
<main>
  <section lang="en">
    <h1>Privacy Policy</h1>
    <p class="subtitle"><strong>Solitaire Klondike</strong></p>
    <p class="date"><strong>Effective date:</strong> October 4, 2026</p>

    <p>Paul Kart respects the privacy of users of <strong>Solitaire Klondike</strong>. This Privacy Policy explains how information is handled when you use the game.</p>

    <h2>1. Personal Data Collection</h2>
    <p><strong>Solitaire Klondike does not collect, store, or transmit personal data.</strong> The game does not require registration, account creation, or the submission of a name, email address, telephone number, or other personal information.</p>

    <h2>2. Internet Connection</h2>
    <p>Solitaire Klondike is designed to work without an Internet connection. The game does not transmit user information to servers operated by the developer or to third parties.</p>

    <h2>3. Local Game Data</h2>
    <p>Game progress and settings, where saved by the game, are stored locally on the user's device. This information is not transmitted to the developer or uploaded to external servers.</p>
    <p>If the game is uninstalled, locally stored game data may be deleted in accordance with the device's operating system and settings.</p>

    <h2>4. Third-Party Services</h2>
    <p>The game does not use third-party services for advertising, analytics, user tracking, in-app purchases, or collection of personal data.</p>

    <h2>5. Children</h2>
    <p>The game does not request or collect personal information from users, including children.</p>

    <h2>6. Changes to This Privacy Policy</h2>
    <p>This Privacy Policy may be updated from time to time. If changes are made, the updated version will be published at this web address. Users are encouraged to review this page periodically.</p>

    <h2>7. Contact</h2>
    <p>If you have questions about this Privacy Policy or the privacy practices of Solitaire Klondike, contact the developer:</p>
    <p><strong>Paul Kart</strong><br>Email: <a href="mailto:paulkart.youtube@gmail.com">paulkart.youtube@gmail.com</a></p>
  </section>

  <section lang="ru" class="language">
    <h1>Политика конфиденциальности</h1>
    <p class="subtitle"><strong>Solitaire Klondike</strong></p>
    <p class="date"><strong>Дата вступления в силу:</strong> 4 октября 2026 года</p>

    <p>Разработчик <strong>Paul Kart</strong> уважает конфиденциальность пользователей игры <strong>Solitaire Klondike</strong>. Настоящая Политика конфиденциальности объясняет, как обрабатывается информация при использовании игры.</p>

    <h2>1. Сбор персональных данных</h2>
    <p><strong>Solitaire Klondike не собирает, не хранит и не передаёт персональные данные.</strong> Игра не требует регистрации, создания учётной записи или предоставления имени, адреса электронной почты, номера телефона либо других персональных данных.</p>

    <h2>2. Интернет-соединение</h2>
    <p>Solitaire Klondike предназначена для работы без подключения к Интернету. Игра не передаёт информацию о пользователе на серверы разработчика или третьих лиц.</p>

    <h2>3. Локальные игровые данные</h2>
    <p>Игровой прогресс и настройки, если они сохраняются игрой, хранятся локально на устройстве пользователя. Эти данные не передаются разработчику и не загружаются на внешние серверы.</p>
    <p>При удалении игры локально сохранённые игровые данные могут быть удалены в соответствии с настройками устройства и операционной системы.</p>

    <h2>4. Сторонние сервисы</h2>
    <p>Игра не использует сторонние сервисы для рекламы, аналитики, отслеживания пользователей, внутриигровых покупок или сбора персональных данных.</p>

    <h2>5. Дети</h2>
    <p>Игра не запрашивает и не собирает персональную информацию пользователей, включая детей.</p>

    <h2>6. Изменения настоящей Политики</h2>
    <p>Политика конфиденциальности может периодически обновляться. В случае внесения изменений новая версия будет опубликована по этому же адресу. Рекомендуется периодически просматривать эту страницу.</p>

    <h2>7. Контакты</h2>
    <p>Если у вас есть вопросы относительно настоящей Политики конфиденциальности или конфиденциальности игры Solitaire Klondike, свяжитесь с разработчиком:</p>
    <p><strong>Paul Kart</strong><br>E-mail: <a href="mailto:paulkart.youtube@gmail.com">paulkart.youtube@gmail.com</a></p>
  </section>

  <footer><p>© 2026 Paul Kart. All rights reserved.</p></footer>
</main>
</body>
</html>
